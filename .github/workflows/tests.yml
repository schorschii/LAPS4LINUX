name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: ${{ matrix.component }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
        component: [laps-runner, laps-client]

    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        working-directory: ${{ matrix.component }}
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.component }}" = "laps-client" ]; then
            python -m pip install '.[barcode]'
          else
            python -m pip install .
          fi

      - name: Run tests
        working-directory: ${{ matrix.component }}
        run: python -m unittest tests/*.py

  typecheck:
    name: mypy
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r laps-runner/requirements.txt \
            -r laps-client/requirements.txt \
            -r laps-client/requirements-barcode.txt \
            mypy==2.4.1

      - name: Run mypy
        run: mypy
